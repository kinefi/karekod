<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süresiz Ücretsiz QR Kod Üretici</title>
    <!-- QR Kod Oluşturma Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { margin-top: 0; color: #333; }
        p { color: #666; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .colors {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .color-picker {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 QR Kod Üretici</h2>
    <p>Statik ve süresi asla dolmayan QR kodlar üretin.</p>
    
    <input type="text" id="text" placeholder="https://example.com veya bir metin girin">
    
    <div class="colors">
        <div class="color-picker">
            <label>Çizgi:</label>
            <input type="color" id="colorDark" value="#000000">
        </div>
        <div class="color-picker">
            <label>Zemin:</label>
            <input type="color" id="colorLight" value="#ffffff">
        </div>
    </div>

    <button onclick="generateQR()">QR Kod Oluştur</button>

    <div id="qrcode"></div>
</div>

<script>
    let qrcode = null;

    function generateQR() {
        const text = document.getElementById("text").value;
        const colorDark = document.getElementById("colorDark").value;
        const colorLight = document.getElementById("colorLight").value;
        const qrContainer = document.getElementById("qrcode");

        if (!text.trim()) {
            alert("Lütfen bir metin veya URL girin!");
            return;
        }

        // Önceki QR kodu temizle
        qrContainer.innerHTML = "";

        // Yeni QR kod oluştur
        qrcode = new QRCode(qrContainer, {
            text: text,
            width: 200,
            height: 200,
            colorDark : colorDark,
            colorLight : colorLight,
            correctLevel : QRCode.CorrectLevel.H
        });
    }
</script>

</body>
</html>
